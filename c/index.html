const viewer=document.querySelector('#viewer'),preview=document.querySelector('#preview'),hero=document.querySelector('#hero-player');const heroSrc=hero.src;function stopHero(){if(hero.src!==heroSrc.replace('?autoplay=1',''))hero.src=heroSrc.replace('?autoplay=1','')}function show(item){stopHero();document.querySelector('#viewer-title').textContent=item.name;document.querySelector('#original').href=item.url;preview.src=item.preview;viewer.showModal()}document.querySelector('#close').onclick=()=>viewer.close();viewer.addEventListener('close',()=>preview.src='about:blank');new IntersectionObserver(entries=>{if(!entries[0].isIntersecting)stopHero()},{threshold:0}).observe(document.querySelector('.hero'));
