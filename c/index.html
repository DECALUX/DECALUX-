<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Chauncey Allen — Actor · Director · Writer">
<title>Chauncey Campanaro</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:#000;color:rgba(245,242,234,0.92);font-family:'Georgia',serif;-webkit-font-smoothing:antialiased;}
::selection{background:rgba(245,242,234,0.18);color:#fff;}
img{display:block;width:100%;height:100%;object-fit:cover;}

#stage{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(0.8rem,2.5vh,1.6rem) clamp(1rem,4vw,3rem);gap:clamp(0.5rem,1.6vh,1rem);}
#name{font-size:clamp(1.3rem,3.8vw,2.4rem);font-weight:400;letter-spacing:0.22em;padding-left:0.22em;color:#fffdf7;text-shadow:0 0 60px rgba(245,242,234,0.25);}
#under{display:flex;align-items:center;gap:clamp(0.7rem,2.4vw,1.5rem);}
#under i{width:clamp(20px,4vw,34px);height:1px;background:rgba(245,242,234,0.4);}
#under span{font-size:clamp(0.5rem,1.1vw,0.68rem);letter-spacing:0.5em;padding-left:0.5em;text-transform:uppercase;color:rgba(245,242,234,0.55);}

/* the grid: two | one | two */
#grid{width:min(640px,100%);display:grid;grid-template-columns:1fr 1fr;gap:clamp(0.6rem,1.6vw,1rem);flex:1;min-height:0;grid-template-rows:minmax(0,1fr) minmax(0,0.9fr) minmax(0,1fr);}
.tile{position:relative;display:block;border:1px solid rgba(245,242,234,0.14);background:#070707;overflow:hidden;outline:none;transition:border-color .5s ease,box-shadow .5s ease;}
.tile img{filter:grayscale(0.1);transition:filter .6s ease,transform .9s ease;}
.tile:hover,.tile:focus-visible{border-color:rgba(255,253,247,0.7);box-shadow:0 0 46px rgba(245,242,234,0.12);}
.tile:hover img,.tile:focus-visible img{filter:none;transform:scale(1.025);}
.tile span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.62);font-size:clamp(0.6rem,1.3vw,0.8rem);letter-spacing:0.6em;padding-left:0.6em;text-transform:uppercase;color:#fffdf7;opacity:0;transition:opacity .4s ease;}
.tile:hover span,.tile:focus-visible span{opacity:1;}
#cinema{grid-column:1/-1;}
#acting img{object-position:50% 20%;}
#model img{object-position:50% 0;}
#script img,#poetry img{object-position:50% 0;}

#home{width:clamp(36px,4.5vw,50px);display:block;outline:none;transition:filter .45s ease;}
#home svg{display:block;width:100%;height:auto;}
#home:hover svg,#home:focus-visible svg{filter:brightness(1.5) drop-shadow(0 0 14px rgba(245,242,234,0.35));}

#stage>*{opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s ease;}
body.on #stage>*{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;}}
@media (hover:none){.tile span{opacity:1;background:linear-gradient(to top,rgba(0,0,0,0.85),transparent 55%);align-items:flex-end;padding-bottom:0.8rem;font-size:0.55rem;}}
</style>
</head>
<body>
<div id="stage">
  <h1 id="name">CHAUNCEY&nbsp;CAMPANARO</h1>
  <div id="under"><i></i><span>Actor &middot; Director &middot; Writer</span><i></i></div>

  <nav id="grid" aria-label="Portfolio">
    <a class="tile" id="acting" href="https://drive.google.com/drive/folders/1liC1gCi2nVtR3A1X4QPzK9a3Me_mALX1?usp=sharing" target="_blank" rel="noopener">
      <img src="/c/img/acting.jpg" alt="Chauncey Allen — acting"><span>Acting</span></a>

    <a class="tile" id="script" href="https://drive.google.com/file/d/1zN8Ih4T7lHF3Rsi8Yd6mJwxUYDLaQlbC/view" target="_blank" rel="noopener">

    <a class="tile" id="poetry" href="https://drive.google.com/file/d/12Bk5jhPxKFhR6peJWZqJV_Nr59WdByF5/view" target="_blank" rel="noopener">
      <img src="/c/img/poetry.jpg" alt="The Red Marlin — poetry"><span>Poetry</span></a>
  </nav>

  <a id="home" href="https://www.decalux.art" aria-label="Decalux">

      <path d="M220 152 C216 190 210 240 204 290 C202 310 200 330 198 358" stroke="rgba(248,245,238,0.85)" stroke-width="3.5" stroke-linecap="round"/>

    </svg>
  </a>
</div>
<script>requestAnimationFrame(()=>setTimeout(()=>document.body.classList.add('on'),120));</script>
</body>
</html>
