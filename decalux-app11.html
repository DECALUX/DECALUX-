<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DECALUX</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#000;overflow:hidden;}
  body{touch-action:none;-webkit-tap-highlight-color:transparent;}
  #field{display:block;width:100vw;height:100vh;height:100dvh;}
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function(){
  "use strict";
  const cv = document.getElementById('field');
  const ctx = cv.getContext('2d', { alpha:false });
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W=0,H=0,DPR=1,CX=0,CY=0,MIN=0,sunR=0;

  /* ─────────── THE BRAIN'S OWN RHYTHM ───────────
     A live EEG composite. Real bands, real 1/f-ish amplitude, alpha
     weighted up the way a relaxed waking cortex actually sits. This
     is the voltage. It governs everything that lights ambiently. */
  const BANDS = [
    { f:2.5, a:1.00, ph:Math.random()*6.2832 },  // delta
    { f:6.0, a:0.52, ph:Math.random()*6.2832 },  // theta
    { f:10.0,a:0.86, ph:Math.random()*6.2832 },  // alpha  (Berger — relaxed, dominant)
    { f:21.0,a:0.30, ph:Math.random()*6.2832 },  // beta
    { f:40.0,a:0.16, ph:Math.random()*6.2832 }   // gamma  (binding / comprehension)
  ];
  const ASUM = BANDS.reduce((s,b)=>s+b.a,0);
  function eeg(t){
    let v=0;
    for(const b of BANDS) v += b.a*Math.sin(6.2832*b.f*t + b.ph);
    return v/ASUM;
  }
  function eegBand(t,i){
    const b=BANDS[i];
    return b.a*Math.sin(6.2832*b.f*t + b.ph)/ASUM;
  }

  /* ─────────── THE QUASAR, STRUCTURED AS A BRAIN ───────────
     Two elliptical hemispheres split by a fissure. Nearest-neighbour
     cortical links + sparse long-range tracts → a small-world graph,
     the true topology of a brain. Centre-relative so it can accrete. */
  let nodes=[], adj=[];
  function buildBrain(){
    nodes=[]; adj=[];
    const rx = MIN*0.46, ry = MIN*0.36;
    const fissure = MIN*0.045;
    const target = Math.round(MIN*0.30);
    let guard=0;
    while(nodes.length<target && guard<target*40){
      guard++;
      const ang=Math.random()*6.2832, r=Math.sqrt(Math.random());
      let x=Math.cos(ang)*r*rx, y=Math.sin(ang)*r*ry;
      if(Math.abs(x)<fissure) continue;
      const d=Math.hypot(x,y);
      if(d < sunR*0.82 && Math.random()<0.72) continue;   // shell around the (larger) sun
      nodes.push({x,y});
    }
    const n=nodes.length;
    for(let i=0;i<n;i++) adj[i]=[];
    for(let i=0;i<n;i++){
      const di=[];
      for(let j=0;j<n;j++){
        if(i===j) continue;
        if((nodes[i].x<0)!==(nodes[j].x<0)) continue;
        const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
        di.push([dx*dx+dy*dy,j]);
      }
      di.sort((a,b)=>a[0]-b[0]);
      for(let m=0;m<Math.min(3,di.length);m++){
        const j=di[m][1];
        if(adj[i].indexOf(j)<0){ adj[i].push(j); adj[j].push(i); }
      }
    }
    const tracts=Math.max(4, Math.round(n*0.10));
    for(let t=0;t<tracts;t++){
      const i=(Math.random()*n)|0, j=(Math.random()*n)|0;
      if(i===j) continue;
      if(Math.hypot(nodes[i].x-nodes[j].x, nodes[i].y-nodes[j].y) < MIN*0.22) continue;
      adj[i].push(j); adj[j].push(i);
    }
  }

  /* ─────────── DISCHARGES (ambient, rare, seizure-safe) ─────────── */
  let arcs=[], lastArc=-1;
  const MIN_GAP = reduce ? 2.2 : 0.62;
  function walk(start, hops){
    const pts=[nodes[start]];
    let cur=start, prev=-1;
    for(let h=0;h<hops;h++){
      const ns=adj[cur]; if(!ns||!ns.length) break;
      let nxt=ns[(Math.random()*ns.length)|0];
      if(nxt===prev && ns.length>1) nxt=ns[(Math.random()*ns.length)|0];
      pts.push(nodes[nxt]); prev=cur; cur=nxt;
    }
    return pts;
  }
  function spawnArc(t, strength){
    if(t-lastArc < MIN_GAP) return;
    lastArc=t;
    arcs.push({ pts:walk((Math.random()*nodes.length)|0, 3+((Math.random()*4)|0)),
                born:t, life:0.34+Math.random()*0.30, peak:strength });
    if(arcs.length>22) arcs.shift();
  }

  function rot(p,c,s){ return { x: CX + p.x*c - p.y*s, y: CY + p.x*s + p.y*c }; }

  /* ─────────── VOICE (live microphone) ───────────
     Granted on first touch / click / key — a user gesture, which
     every browser requires for the mic. Speaking electrifies the
     central line to the actual waveform; silence shows no line. */
  let actx=null, analyser=null, tdata=null, micOn=false, voiceLevel=0;
  async function wake(){
    try{
      if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); }
      if(actx.state==='suspended') await actx.resume();
      if(micOn) return;
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      const src = actx.createMediaStreamSource(stream);
      analyser = actx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.6;
      src.connect(analyser);
      tdata = new Float32Array(analyser.fftSize);
      micOn = true;
    }catch(e){ actx=null; micOn=false; }   // denied / unavailable — stay silent, retry on next gesture
  }
  window.addEventListener('pointerdown', wake, {passive:true});
  window.addEventListener('keydown', wake);
  window.addEventListener('touchstart', wake, {passive:true});

  /* ─────────── SIZE ─────────── */
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX=W/2; CY=H/2; MIN=Math.min(W,H);
    sunR = MIN*0.215;                       // heavier, more covering black sun
    buildBrain();
  }
  window.addEventListener('resize', resize, {passive:true});

  /* ─────────── RENDER ─────────── */
  let t0=performance.now(), t=0, angle=0, prevV=0;

  function frame(now){
    const dt=Math.min(0.05,(now-t0)/1000); t0=now; t+=dt;
    if(!reduce) angle += dt*0.018;
    const c=Math.cos(angle), s=Math.sin(angle);

    const v = reduce ? 0 : eeg(t);
    const av = Math.abs(v);
    if(!reduce && v>0.62 && prevV<=0.62) spawnArc(t, Math.min(1, 0.55+av*0.6));
    prevV=v;

    // read the microphone
    if(micOn && analyser){
      analyser.getFloatTimeDomainData(tdata);
      let sum=0; for(let i=0;i<tdata.length;i++) sum+=tdata[i]*tdata[i];
      const rms=Math.sqrt(sum/tdata.length);
      voiceLevel += (rms - voiceLevel)*0.35;
    }
    const voice = Math.min(1, voiceLevel*9);

    // black
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,W,H);

    // bipolar jets
    if(!reduce){
      const jet = 0.05 + Math.max(0,v)*0.045 + voice*0.05;
      const jg = ctx.createLinearGradient(0,CY-MIN*0.6,0,CY+MIN*0.6);
      jg.addColorStop(0,'rgba(120,160,255,0)');
      jg.addColorStop(0.5,'rgba(150,185,255,'+jet+')');
      jg.addColorStop(1,'rgba(120,160,255,0)');
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=jg;
      ctx.fillRect(CX-MIN*0.012, CY-MIN*0.6, MIN*0.024, MIN*1.2);
    }

    // connectome — dim filaments
    ctx.globalCompositeOperation='lighter';
    ctx.lineWidth=0.6;
    for(let i=0;i<nodes.length;i++){
      const a=rot(nodes[i],c,s);
      for(const j of adj[i]){
        if(j<i) continue;
        const b=rot(nodes[j],c,s);
        const flow = reduce ? 0 : (0.5+0.5*eegBand(t,2));
        const al = 0.020 + flow*0.030;
        ctx.strokeStyle='rgba(120,150,205,'+al.toFixed(3)+')';
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }
    for(let i=0;i<nodes.length;i++){
      const a=rot(nodes[i],c,s);
      ctx.fillStyle='rgba(150,180,230,0.10)';
      ctx.beginPath(); ctx.arc(a.x,a.y,0.7,0,6.2832); ctx.fill();
    }

    // bright discharges
    for(let k=arcs.length-1;k>=0;k--){
      const arc=arcs[k]; const age=(t-arc.born)/arc.life;
      if(age>=1){ arcs.splice(k,1); continue; }
      const fade=(1-age), pts=arc.pts;
      ctx.strokeStyle='rgba(150,195,255,'+(0.10*fade*arc.peak).toFixed(3)+')';
      ctx.lineWidth=4.5; ctx.beginPath();
      for(let m=0;m<pts.length;m++){ const p=rot(pts[m],c,s); m?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }
      ctx.stroke();
      ctx.strokeStyle='rgba(232,244,255,'+(0.85*fade*arc.peak).toFixed(3)+')';
      ctx.lineWidth=1.25; ctx.beginPath();
      for(let m=0;m<pts.length;m++){ const p=rot(pts[m],c,s); m?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }
      ctx.stroke();
      const tip=rot(pts[pts.length-1],c,s);
      ctx.fillStyle='rgba(255,255,255,'+(0.5*fade*arc.peak).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(tip.x,tip.y,1.6,0,6.2832); ctx.fill();
    }

    // THE BLACK SUN — opaque, laid over everything
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(CX,CY,sunR,0,6.2832); ctx.fill();

    // corona — photon ring, Doppler-beamed, lifts with the voice
    ctx.globalCompositeOperation='lighter';
    const beam=angle, steps=120;
    ctx.lineWidth=1.6;
    for(let q=0;q<steps;q++){
      const a0=(q/steps)*6.2832, a1=((q+1)/steps)*6.2832;
      const lobe=0.45+0.55*Math.pow(0.5+0.5*Math.cos(a0-beam),2.2);
      const turb=0.85+0.15*Math.sin(a0*7+t*1.3);
      const br=(0.17+0.15*av+voice*0.16)*lobe*turb;
      ctx.strokeStyle='rgba(205,228,255,'+br.toFixed(3)+')';
      ctx.beginPath(); ctx.arc(CX,CY,sunR+0.6,a0,a1); ctx.stroke();
    }
    const cg=ctx.createRadialGradient(CX,CY,sunR*0.97,CX,CY,sunR*1.5);
    cg.addColorStop(0,'rgba(170,205,255,'+(0.09+0.07*av+voice*0.12).toFixed(3)+')');
    cg.addColorStop(1,'rgba(170,205,255,0)');
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.arc(CX,CY,sunR*1.5,0,6.2832); ctx.fill();
    const dx=CX+Math.cos(beam)*(sunR+0.6), dy=CY+Math.sin(beam)*(sunR+0.6);
    const dgg=ctx.createRadialGradient(dx,dy,0,dx,dy,MIN*0.05);
    dgg.addColorStop(0,'rgba(255,255,255,'+(0.20+0.16*av).toFixed(3)+')');
    dgg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=dgg;
    ctx.beginPath(); ctx.arc(dx,dy,MIN*0.05,0,6.2832); ctx.fill();

    // THE VOICE LINE — central, electrifies to your voice; nothing when silent
    if(micOn && voiceLevel>0.0045){
      const span=MIN*0.17, n=160;
      const bright=Math.min(1, voiceLevel*9);
      const draw=(w,col)=>{
        ctx.lineWidth=w; ctx.strokeStyle=col; ctx.beginPath();
        for(let i=0;i<n;i++){
          const idx=(i/(n-1)*(tdata.length-1))|0;
          const x=CX-span + (i/(n-1))*span*2;
          let yy=Math.max(-1,Math.min(1, tdata[idx]*4));
          const y=CY + yy*MIN*0.12;
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.stroke();
      };
      ctx.globalCompositeOperation='lighter';
      draw(4.5,'rgba(150,195,255,'+(0.10*bright).toFixed(3)+')');
      draw(1.3,'rgba(232,244,255,'+(0.9*bright).toFixed(3)+')');
    }

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
