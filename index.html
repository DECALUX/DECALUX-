<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECALUX</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Georgia',serif;}
#stage{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1.5rem,4vh,3rem);}

#elephant{opacity:0;transition:opacity 0.1s ease;}
#elephant svg{width:clamp(200px,35vw,420px);height:auto;display:block;}

#title{
  font-size:clamp(0.6rem,1.4vw,1rem);
  letter-spacing:clamp(0.5em,2.5vw,1.2em);
  text-transform:uppercase;
  color:rgba(240,236,226,0);
  transition:none;
  white-space:nowrap;
  overflow:hidden;
  max-width:0;
}

#qr-wrap{opacity:0;transition:opacity 1.5s ease;display:flex;flex-direction:column;align-items:center;gap:0.75rem;}
#qr-wrap img{width:clamp(120px,20vw,220px);height:auto;display:block;}
#scan{font-size:clamp(0.35rem,0.7vw,0.55rem);letter-spacing:0.45em;text-transform:uppercase;color:rgba(240,236,226,0.3);}
</style>
</head>
<body>
<div id="stage">
  <a href="mailto:moonwinellc@gmail.com" id="elephant">
    <svg viewBox="0 0 500 380" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="250" cy="110" rx="72" ry="48" stroke="rgba(240,236,226,0.85)" stroke-width="1.2"/>
      <ellipse cx="316" cy="82" rx="36" ry="28" stroke="rgba(240,236,226,0.85)" stroke-width="1.2"/>
      <circle cx="326" cy="75" r="3.5" stroke="rgba(240,236,226,0.85)" stroke-width="1"/>
      <path d="M338 96 C360 108 375 130 368 162 C362 188 345 200 350 218" stroke="rgba(240,236,226,0.85)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M296 68 C278 52 268 72 282 88 C288 95 296 90 296 68Z" stroke="rgba(240,236,226,0.75)" stroke-width="1" fill="none"/>
      <path d="M178 118 C160 124 148 136 152 148" stroke="rgba(240,236,226,0.6)" stroke-width="1" fill="none" stroke-linecap="round"/>
      <path d="M220 152 C216 190 210 240 204 290 C202 310 200 330 198 358" stroke="rgba(240,236,226,0.85)" stroke-width="1" fill="none" stroke-linecap="round"/>
      <path d="M244 155 C242 195 240 248 238 295 C236 318 235 338 234 362" stroke="rgba(240,236,226,0.85)" stroke-width="1" fill="none" stroke-linecap="round"/>
      <path d="M268 155 C270 193 272 246 274 294 C275 318 276 340 278 365" stroke="rgba(240,236,226,0.85)" stroke-width="1" fill="none" stroke-linecap="round"/>
      <path d="M292 152 C298 190 304 243 310 290 C313 314 315 336 318 362" stroke="rgba(240,236,226,0.85)" stroke-width="1" fill="none" stroke-linecap="round"/>
      <ellipse cx="197" cy="360" rx="7" ry="3" stroke="rgba(240,236,226,0.7)" stroke-width="1"/>
      <ellipse cx="233" cy="364" rx="7" ry="3" stroke="rgba(240,236,226,0.7)" stroke-width="1"/>
      <ellipse cx="279" cy="367" rx="7" ry="3" stroke="rgba(240,236,226,0.7)" stroke-width="1"/>
      <ellipse cx="319" cy="364" rx="7" ry="3" stroke="rgba(240,236,226,0.7)" stroke-width="1"/>
    </svg>
  </a>DECALUX</div>


</div>

<script>
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

async function run(){
  const el=document.getElementById('elephant');
  const title=document.getElementById('title');
  const qr=document.getElementById('qr-wrap');

  // 1 — elephant flickers in like a CRT
  await wait(600);
  el.style.opacity='1';
  await wait(80); el.style.opacity='0.1';
  await wait(60); el.style.opacity='1';
  await wait(50); el.style.opacity='0.3';
  await wait(40); el.style.opacity='1';

  // 2 — DECALUX sweeps in like headlights turning a corner
  await wait(1200);
  title.style.transition='max-width 1.4s cubic-bezier(0.22,1,0.36,1), color 1.2s ease';
  title.style.color='rgba(240,236,226,0.85)';
  title.style.maxWidth='600px';

  // 3 — QR fades in and settles
  await wait(2000);
  qr.style.opacity='1';
}

run();
</script>
</body>
</html>
