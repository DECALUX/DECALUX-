/* ─────────── STAGE (the only page) ─────────── */

.key{border-radius:3px 3px 5px 5px;position:relative;transition:background 0.4s ease,box-shadow 0.4s ease,transform 0.15s ease;cursor:default;}

.key:nth-child(2){width:clamp(28px,3.5vw,50px);height:clamp(82px,10.5vw,140px);}
.key:nth-child(3){width:clamp(28px,3.5vw,50px);height:clamp(90px,11.5vw,155px);}
.key:nth-child(4){width:clamp(28px,3.5vw,50px);height:clamp(78px,10vw,135px);}
.key:nth-child(5){width:clamp(28px,3.5vw,50px);height:clamp(95px,12vw,165px);}
.key:nth-child(6){width:clamp(28px,3.5vw,50px);height:clamp(88px,11vw,150px);}
.key:nth-child(7){width:clamp(28px,3.5vw,50px);height:clamp(72px,9.2vw,125px);}
.key:nth-child(8){width:clamp(28px,3.5vw,50px);height:clamp(85px,10.8vw,145px);}
.key:nth-child(9){width:clamp(28px,3.5vw,50px);height:clamp(92px,11.8vw,158px);}
.key:nth-child(10){width:clamp(28px,3.5vw,50px);height:clamp(75px,9.5vw,130px);}

.key[data-c="red"].dim{background:rgba(176,40,28,0.12);border-color:rgba(176,40,28,0.2);}
.key[data-c="orange"].dim{background:rgba(190,90,20,0.12);border-color:rgba(190,90,20,0.2);}
.key[data-c="yellow"].dim{background:rgba(180,160,20,0.12);border-color:rgba(180,160,20,0.2);}
.key[data-c="green"].dim{background:rgba(30,100,60,0.12);border-color:rgba(30,100,60,0.2);}
.key[data-c="teal"].dim{background:rgba(20,120,110,0.12);border-color:rgba(20,120,110,0.2);}
.key[data-c="blue"].dim{background:rgba(25,60,130,0.12);border-color:rgba(25,60,130,0.2);}
.key[data-c="violet"].dim{background:rgba(80,30,140,0.12);border-color:rgba(80,30,140,0.2);}
.key[data-c="ochre"].dim{background:rgba(160,110,20,0.12);border-color:rgba(160,110,20,0.2);}
.key[data-c="black"].dim{background:rgba(40,40,40,0.18);border-color:rgba(80,80,80,0.2);}
.key[data-c="white"].dim{background:rgba(220,220,210,0.08);border-color:rgba(220,220,210,0.15);}

.key[data-c="red"].lit,#keyboard.playable .key[data-c="red"]:hover,#keyboard.playable .key[data-c="red"]:focus-visible{background:#b0281c;box-shadow:0 0 30px rgba(176,40,28,0.8),0 0 60px rgba(176,40,28,0.35);border-color:#c0392b;}
.key[data-c="orange"].lit,#keyboard.playable .key[data-c="orange"]:hover,#keyboard.playable .key[data-c="orange"]:focus-visible{background:#be5a14;box-shadow:0 0 30px rgba(190,90,20,0.8),0 0 60px rgba(190,90,20,0.35);border-color:#d4691a;}
.key[data-c="yellow"].lit,#keyboard.playable .key[data-c="yellow"]:hover,#keyboard.playable .key[data-c="yellow"]:focus-visible{background:#b4a014;box-shadow:0 0 30px rgba(180,160,20,0.8),0 0 60px rgba(180,160,20,0.35);border-color:#c8b020;}
.key[data-c="green"].lit,#keyboard.playable .key[data-c="green"]:hover,#keyboard.playable .key[data-c="green"]:focus-visible{background:#1e643c;box-shadow:0 0 30px rgba(30,100,60,0.8),0 0 60px rgba(30,100,60,0.35);border-color:#2d8a52;}

.key[data-c="ochre"].lit,#keyboard.playable .key[data-c="ochre"]:hover,#keyboard.playable .key[data-c="ochre"]:focus-visible{background:#a06e14;box-shadow:0 0 30px rgba(160,110,20,0.8),0 0 60px rgba(160,110,20,0.35);border-color:#c08418;}

#key-label{height:1.3em;margin-top:clamp(0.9rem,2.2vh,1.5rem);font-size:0.6rem;letter-spacing:0.5em;text-transform:uppercase;color:rgba(245,242,234,0.45);opacity:0;transition:opacity 0.35s ease,color 0.35s ease;z-index:2;text-align:center;}

#mini:hover .mini-dollar,#mini:focus-visible .mini-dollar{opacity:1;}

/* dollar overlay content */
.dollar-glyph{font-size:clamp(3.2rem,10vw,6.5rem);color:#fffdf7;text-shadow:0 0 50px rgba(245,242,234,0.3);margin-bottom:clamp(1.2rem,3vh,2rem);line-height:1;}
.dollar-line{font-size:clamp(1.05rem,2vw,1.4rem);color:rgba(245,242,234,0.85);}
.claim{display:inline-block;margin-top:clamp(1.8rem,4.5vh,2.8rem);font-size:clamp(0.85rem,1.4vw,1rem);letter-spacing:0.35em;text-transform:uppercase;color:rgba(255,253,247,0.9);text-decoration:none;border-bottom:1px solid rgba(245,242,234,0.35);padding-bottom:0.45rem;transition:border-color 0.4s ease,color 0.4s ease;}
.claim:hover{border-color:rgba(255,253,247,0.9);color:#fff;}
.sunline{margin-top:clamp(2.4rem,6vh,3.6rem);font-size:clamp(0.62rem,1vw,0.8rem);font-style:italic;letter-spacing:0.28em;color:rgba(245,242,234,0.32);}

/* write overlay content */
#msg-text{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(245,242,234,0.18);color:rgba(255,253,247,1);font-family:'Georgia',serif;font-size:clamp(1.05rem,1.7vw,1.3rem);line-height:1.7;padding:clamp(1rem,2vw,1.4rem) 0;resize:none;outline:none;transition:border-color 0.6s ease;min-height:160px;border-radius:0;caret-color:rgba(255,253,247,0.9);text-align:left;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0.01ms !important;animation-duration:0.01ms !important;}
}
@media(max-width:600px){
  #key-label{letter-spacing:0.35em;font-size:0.55rem;}
  #ov-body{font-size:1rem;}
}
</style>

<script>
const kb=document.getElementById('keyboard');
const keys=[...document.querySelectorAll('.key')];
const dali=document.getElementById('dali');

function wait(ms){return new Promise(r=>setTimeout(r,ms));}

/* ─────────── SECTIONS — edit your copy here ─────────── */
const SECTIONS={

/* one soft note per key — a major pentatonic, left to right */
const NOTES={red:261.63,orange:293.66,yellow:329.63,green:392.00,teal:440.00,blue:523.25,violet:587.33,ochre:659.25,black:783.99,white:880.00};
let actx=null;
function tone(f){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15,actx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.9);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+1);
  }catch(e){}
}

/* ─────────── OVERLAY ─────────── */
let overlayOpen=false;
function openSection(c){
  const s=SECTIONS[c];if(!s)return;
  ovBar.style.background=s.accent;
  ovTitle.textContent=s.title;
  ovTitle.style.color=s.accent;
  ovTitle.style.display=s.title?'':'none';
  ovBody.innerHTML=s.body;
  overlay.classList.add('open');
  overlayOpen=true;
  if(c==='white'){setTimeout(()=>{const t=document.getElementById('msg-text');if(t)t.focus();},420);}
}
function closeOverlay(){overlay.classList.remove('open');overlayOpen=false;}
document.getElementById('ov-close').addEventListener('click',closeOverlay);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeOverlay();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlayOpen)closeOverlay();});

/* cmd / ctrl + enter sends, from inside the injected form */
overlay.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='msg-text'&&(e.metaKey||e.ctrlKey)&&e.key==='Enter'){
    e.preventDefault();
    document.getElementById('msg-form').requestSubmit();
  }
});

/* contact form → moonwinellc@gmail.com */
function sendMessage(e){
  e.preventDefault();
  const txt=document.getElementById('msg-text').value.trim();
  if(!txt)return;
  const subject=encodeURIComponent('From decalux.art');
  const body=encodeURIComponent(txt);
  window.location.href='mailto:moonwinellc@gmail.com?subject='+subject+'&body='+body;
}

/* ─────────── PLAYABLE KEYBOARD ─────────── */
function playKey(k){
  const c=k.dataset.c;
  tone(NOTES[c]);
  k.classList.add('pressed-anim');
  setTimeout(()=>k.classList.remove('pressed-anim'),260);
  setTimeout(()=>openSection(c),230);
}
function enablePlay(){
  kb.classList.add('playable');
  keys.forEach(k=>{
    const c=k.dataset.c;
    k.setAttribute('role','button');
    k.setAttribute('tabindex','0');
    k.setAttribute('aria-label',SECTIONS[c].title);
    k.addEventListener('click',()=>playKey(k));
    k.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();playKey(k);}});
    k.addEventListener('mouseenter',()=>{label.textContent=SECTIONS[c].title;label.style.color=SECTIONS[c].accent;label.style.opacity='1';});
    k.addEventListener('mouseleave',()=>{label.style.opacity='0';});
  });
}
mini.addEventListener('click',()=>{tone(130.81);openSection('dollar');});
mini.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tone(130.81);openSection('dollar');}});

/* ─────────── INTRO CEREMONY ─────────── */
async function intro(){
  await wait(400);
  kb.style.opacity='1';
  await wait(100);
  keys.forEach((k,i)=>setTimeout(()=>k.classList.add('dim'),i*90));
  await wait(1800);

  for(let c of ['red','green','blue']){
    const k=rgbKeys[c];
    k.classList.remove('dim');
    k.classList.add('lit');
    await wait(180);
    k.classList.remove('lit');
    k.classList.add('pressed');
    await wait(320);
  }
  await wait(300);
  Object.values(rgbKeys).forEach(k=>{k.classList.remove('pressed');k.classList.add('lit');});
  await wait(600);

  kb.style.transition='opacity 0.7s ease';
  kb.style.opacity='0';
  await wait(800);
  dali.style.opacity='1';
  daliSvg.style.transition='opacity 0.15s ease';
  daliSvg.style.opacity='1';
  await wait(80);daliSvg.style.opacity='0.1';
  await wait(60);daliSvg.style.opacity='1';
  await wait(50);daliSvg.style.opacity='0.3';
  await wait(40);daliSvg.style.opacity='1';
  await wait(200);
  daliTxt.style.transition='opacity 0.08s ease';
  daliTxt.style.opacity='1';
  await wait(60);daliTxt.style.opacity='0.2';
  await wait(50);daliTxt.style.opacity='1';
  await wait(40);daliTxt.style.opacity='0.5';
  await wait(40);daliTxt.style.opacity='1';
  await wait(2400);

  dali.style.transition='opacity 1.4s ease';
  dali.style.opacity='0';
  await wait(1600);
  schop.style.transition='opacity 1.8s ease';
  schop.style.opacity='1';
  await wait(5000);
  schop.style.transition='opacity 1.2s ease';
  schop.style.opacity='0';
  await wait(1400);

  /* the keyboard returns — this time it can be played */
  keys.forEach(k=>k.classList.remove('lit','pressed','dim'));
  kb.style.transition='opacity 1.2s ease';
  kb.style.opacity='1';
  keys.forEach((k,i)=>setTimeout(()=>k.classList.add('dim'),200+i*70));
  enablePlay();
  await wait(1400);
  mini.classList.add('on');
}
intro();
</script>
